<section class="contenedor-formulario">
  <div class="encabezado">
    <h2>Editar Solicitud #{{ ticketId }}</h2>
    <a routerLink="/" class="btn-volver">← Volver al listado</a>
  </div>

  @if (cargando) {
    <p>Cargando datos del ticket...</p>
  }

  @if (error) {
    <div class="alerta-error">
      {{ error }}
    </div>
  }

  @if (!cargando) {
    <form (ngSubmit)="actualizarTicket()">
      <div class="campo">
        <label for="asunto">Asunto / Resumen *</label>
        <input 
          type="text" 
          id="asunto" 
          name="asunto" 
          [(ngModel)]="ticket.asunto" 
          required>
      </div>

      <div class="campo">
        <label for="solicitante">Nombre del Solicitante *</label>
        <input 
          type="text" 
          id="solicitante" 
          name="solicitante" 
          [(ngModel)]="ticket.solicitante" 
          required>
      </div>

      <div class="grupo-triple">
        <div class="campo">
          <label for="categoria">Categoría</label>
          <select id="categoria" name="categoria" [(ngModel)]="ticket.categoria">
            <option value="Soporte Técnico">Soporte Técnico</option>
            <option value="Redes / Conectividad">Redes / Conectividad</option>
            <option value="Sistemas / Software">Sistemas / Software</option>
            <option value="Acceso / Permisos">Acceso / Permisos</option>
            <option value="Cuentas">Cuentas</option>
            <option value="Hardware">Hardware</option>
            <option value="Soporte">Soporte</option>
          </select>
        </div>

        <div class="campo">
          <label for="prioridad">Prioridad</label>
          <select id="prioridad" name="prioridad" [(ngModel)]="ticket.prioridad">
            <option value="Baja">Baja</option>
            <option value="Media">Media</option>
            <option value="Alta">Alta</option>
          </select>
        </div>

        <div class="campo">
          <label for="estado">Estado</label>
          <select id="estado" name="estado" [(ngModel)]="ticket.estado">
            <option value="Abierto">Abierto</option>
            <option value="En Proceso">En Proceso</option>
            <option value="Cerrado">Cerrado</option>
          </select>
        </div>
      </div>

      <div class="campo">
        <label for="descripcion">Descripción detallada *</label>
        <textarea 
          id="descripcion" 
          name="descripcion" 
          rows="4" 
          [(ngModel)]="ticket.descripcion" 
          required></textarea>
      </div>

      <div class="acciones">
        <button type="submit" class="btn-guardar" [disabled]="guardando">
          {{ guardando ? 'Guardando...' : 'Actualizar Ticket' }}
        </button>
        <a routerLink="/" class="btn-cancelar">Cancelar</a>
      </div>
    </form>
  }
</section>
